name = "ec-rental-landing-page"
main = "src/index.ts"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]

# Serve the site on ecrentalpm.com (Cloudflare creates the DNS records and certificate on deploy).
# The workers.dev address keeps working too.
workers_dev = true
routes = [
  { pattern = "ecrentalpm.com", custom_domain = true },
  { pattern = "www.ecrentalpm.com", custom_domain = true },
]

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/feeds/*", "/photos/*", "/listing", "/sitemap.xml"]

[[d1_databases]]
binding = "DB"
database_name = "ec-rental-db"
database_id = "80e01fdc-9511-4868-9b82-e803290e7700"

# Listing photos. Create once with: npx wrangler r2 bucket create ec-rental-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "ec-rental-photos"

[vars]
# Must be an address on a domain verified in Resend. RESEND_API_KEY is a secret: npx wrangler secret put RESEND_API_KEY
EMAIL_FROM = "EC Rental <info@ecrentalpm.com>"

# Per-IP/per-email limits for login, signup and password reset.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Per-IP limit for the AI chat and the chat's application/maintenance forms.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
