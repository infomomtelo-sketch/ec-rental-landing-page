name = "ec-rental-landing-page"
main = "src/index.ts"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]

# Serve the site on ecrentalpm.com (Cloudflare creates the DNS records and certificate on deploy).
# The workers.dev address keeps working too.
workers_dev = true
routes = [
  { pattern = "ecrentalpm.com", custom_domain = true },
  { pattern = "www.ecrentalpm.com", custom_domain = true },
  # tello.live is the Tello video page (its home is /videos; see src/index.ts).
  { pattern = "tello.live", custom_domain = true },
  { pattern = "www.tello.live", custom_domain = true },
]

# Daily jobs (src/index.ts scheduled): rent reminders. 16:00 UTC is 9am in Fresno (8am in winter).
[triggers]
crons = ["0 16 * * *"]

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/ask", "/build", "/business", "/b/*", "/m/*", "/embed/*", "/api/*", "/feeds/*", "/photos/*", "/listing", "/rentals/*", "/sitemap.xml", "/robots.txt", "/llms.txt", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "ec-rental-db"
database_id = "80e01fdc-9511-4868-9b82-e803290e7700"

# Listing photos. Create once with: npx wrangler r2 bucket create ec-rental-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "ec-rental-photos"

[vars]
# Must be an address on a domain verified in Resend. RESEND_API_KEY is a secret: npx wrangler secret put RESEND_API_KEY
EMAIL_FROM = "EC Rental <info@ecrentalpm.com>"
# tello.live assistant (src/tello-hub.ts): Anthropic prices for the daily spend cap, and the cap itself.
# Claude Sonnet 5.5 is $2 per million input tokens and $10 per million output tokens; web search is $10 per 1,000 searches.
# When the day's spend reaches HUB_DAILY_CENTS (500 = $5), the chat switches to the free Workers AI model until midnight UTC.
HUB_IN_PER_M = "2"
HUB_OUT_PER_M = "10"
HUB_SEARCH_PER_K = "10"
HUB_DAILY_CENTS = "500"
# Business assistants (tello.live/business) use Claude too, with their own budget across all businesses ($10 a day), then Workers AI.
BIZ_DAILY_CENTS = "1000"
# Everything else that writes with AI (EC Rental dashboard chat, listings, inspections summaries, renter chat, video scripts) also uses Claude Sonnet 5.5 first, with a $15 a day budget, then Workers AI.
APP_DAILY_CENTS = "1500"

# Per-IP/per-email limits for login, signup and password reset.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Per-IP limit for the AI chat and the chat's application/maintenance forms.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
