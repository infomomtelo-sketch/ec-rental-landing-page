<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Chat with Tello</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f4f7f6; color: #12231e; display: flex; flex-direction: column; }
    header { background: #0f766e; color: #fff; padding: 12px 16px; font-weight: 700; flex: none; }
    header small { display: block; font-weight: 400; opacity: .85; font-size: 12px; }
    #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .m { max-width: 86%; padding: 9px 13px; border-radius: 14px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
    .m.ai { background: #fff; border: 1px solid #d8e2de; align-self: flex-start; border-bottom-left-radius: 4px; }
    .m.me { background: #0f766e; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .m.err { background: #fdecea; border-color: #f3b6ae; color: #8a2a1d; }
    form { flex: none; display: flex; gap: 8px; padding: 10px; border-top: 1px solid #d8e2de; background: #fff; }
    input { flex: 1; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #b9c9c3; border-radius: 10px; }
    button { font: inherit; font-weight: 600; background: #0f766e; color: #fff; border: 0; border-radius: 10px; padding: 0 16px; cursor: pointer; }
    button:disabled, input:disabled { opacity: .55; }
    input:focus-visible, button:focus-visible { outline: 2px solid #e8a23d; outline-offset: 1px; }
    footer { flex: none; text-align: center; font-size: 11px; color: #5b6f68; padding: 4px 8px 8px; background: #fff; }
    footer a { color: #0f766e; }
  </style>
</head>
<body>
  <header><span id="biz">Chat with us</span><small>Answers from the business's own information</small></header>
  <div id="log" aria-live="polite"></div>
  <form id="f" autocomplete="off"><input id="t" maxlength="600" placeholder="Type your question" aria-label="Your message" /><button id="s" type="submit">Send</button></form>
  <footer>Please don't share card numbers, passwords or health details here. Powered by <a href="https://tello.live/business" target="_blank" rel="noopener">Tello</a></footer>
  <script>
  (function () {
    var id = (location.pathname.match(/\/b\/([a-f0-9]{10})/) || [])[1], log = document.getElementById('log'), t = document.getElementById('t'), s = document.getElementById('s'), convo = [], busy = false;
    function add(cls, text) { var d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
    if (!id) { add('ai err', 'This chat link is not valid.'); t.disabled = s.disabled = true; return; }
    fetch('/api/public/bots/' + id + '/info').then(function (r) { return r.json(); }).then(function (b) {
      if (b.business) { document.getElementById('biz').textContent = 'Chat with ' + b.business; document.title = 'Chat with ' + b.business; }
      add('ai', b.active === false ? 'This assistant is paused. Please contact the business directly.' : (b.greeting || 'Hi! How can I help?'));
      if (b.active === false) t.disabled = s.disabled = true;
    }).catch(function () { add('ai err', 'I could not load this chat. Please try again later.'); });
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault(); var v = t.value.trim(); if (!v || busy) return;
      add('me', v); t.value = ''; convo.push({ role: 'user', content: v }); busy = true; s.disabled = true;
      var w = add('ai', '...');
      fetch('/api/public/bots/' + id + '/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: convo.slice(-10) }) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (x) {
          if (x.ok && x.j.reply) { w.textContent = x.j.reply; convo.push({ role: 'assistant', content: x.j.reply }); }
          else { w.textContent = x.j.error || 'Sorry, something went wrong. Please try again.'; w.className = 'm ai err'; convo.pop(); }
        }).catch(function () { w.textContent = 'I could not reach the server. Please try again.'; w.className = 'm ai err'; convo.pop(); })
        .then(function () { busy = false; s.disabled = false; t.focus(); log.scrollTop = log.scrollHeight; });
    });
  })();
  </script>
</body>
</html>
