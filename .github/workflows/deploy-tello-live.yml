# Deploys the standalone tello.live Worker (repo infomomtelo-sketch/tello-live) with this repo's Cloudflare token and
# copies the keys both Workers share (Anthropic, Stripe, voice) to it. It bridges the gap until the tello-live repo
# has its own CLOUDFLARE_API_TOKEN secret; after that, tello-live deploys itself and this can be deleted.
# Run it from the Actions tab (or ask Claude to). It does not touch the ec-rental-landing-page Worker or its domains.
name: Deploy tello-live

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit of infomomtelo-sketch/tello-live to deploy
        required: true
        default: main
        type: string

concurrency:
  group: deploy-tello-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 701117dde6af00d42bac3c4058b660be
    steps:
      - uses: actions/checkout@v4
        with:
          repository: infomomtelo-sketch/tello-live
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Deploy
        run: npx wrangler deploy
      - name: Copy shared keys to the tello-live Worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: |
          node -e '
            const out = {};
            for (const k of ["ANTHROPIC_API_KEY","STRIPE_SECRET_KEY","ELEVENLABS_API_KEY","ELEVENLABS_VOICE_ID","DEEPINFRA_API_KEY"]) if (process.env[k] && process.env[k].trim()) out[k] = process.env[k].trim();
            console.error("Copying: " + (Object.keys(out).join(", ") || "nothing"));
            process.stdout.write(JSON.stringify(out));
          ' > secrets.json
          if [ "$(cat secrets.json)" != "{}" ]; then npx wrangler secret bulk secrets.json; fi
          rm secrets.json
      - name: Check the deployed pages
        run: |
          if [ -x scripts/smoke.sh ]; then scripts/smoke.sh https://tello-live.infomomtelo.workers.dev; else echo "This tello-live version has no smoke test."; fi
