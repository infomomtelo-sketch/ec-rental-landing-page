# Deploys the site to Cloudflare whenever main changes, so nobody has to run wrangler by hand.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions).
# Optional secrets GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are copied to the Worker when set.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 701117dde6af00d42bac3c4058b660be
    steps:
      - name: Check for the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # schema.sql only uses CREATE ... IF NOT EXISTS, so running it on every deploy is safe.
      - name: Update the database tables
        run: npm run db:init
      # Keys are trimmed because a pasted secret often carries a stray space or newline, which Google rejects as an unknown client.
      - name: Copy Google sign-in keys to the Worker
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            node -e 'process.stdout.write(JSON.stringify({ GOOGLE_CLIENT_ID: process.env.GOOGLE_CLIENT_ID.trim(), GOOGLE_CLIENT_SECRET: process.env.GOOGLE_CLIENT_SECRET.trim() }))' > secrets.json
            npx wrangler secret bulk secrets.json
            rm secrets.json
          else
            echo "Google keys not set in GitHub; leaving the Worker's Google settings as they are."
          fi
      # Paid plans. Only STRIPE_SECRET_KEY is needed (EC Rental's own Stripe account); the site creates the
      # prices, webhook and billing portal in Stripe by itself. STRIPE_WEBHOOK_SECRET is optional.
      - name: Copy Stripe keys to the Worker
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            node -e '
              const out = { STRIPE_SECRET_KEY: process.env.STRIPE_SECRET_KEY.trim() };
              if (process.env.STRIPE_WEBHOOK_SECRET) out.STRIPE_WEBHOOK_SECRET = process.env.STRIPE_WEBHOOK_SECRET.trim();
              process.stdout.write(JSON.stringify(out));
            ' > stripe.json
            npx wrangler secret bulk stripe.json
            rm stripe.json
          else
            echo "STRIPE_SECRET_KEY not set in GitHub; paid sign-up stays off."
          fi
      - name: Deploy
        run: npx wrangler deploy
