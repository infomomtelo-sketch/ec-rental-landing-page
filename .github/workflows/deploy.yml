# Deploys the site to Cloudflare whenever main changes, so nobody has to run wrangler by hand.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions).
# Optional secrets GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET, and ADMIN_EMAILS (comma-separated emails
# that may open /admin), are copied to the Worker when set.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 701117dde6af00d42bac3c4058b660be
    steps:
      - name: Check for the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # schema.sql only uses CREATE ... IF NOT EXISTS, so running it on every deploy is safe.
      - name: Update the database tables
        run: npm run db:init
      # Values are trimmed because a pasted secret often carries a stray space or newline, which Google rejects as an unknown client.
      - name: Copy Google sign-in keys and admin emails to the Worker
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: |
          node -e '
            const env = process.env, out = {};
            if (env.GOOGLE_CLIENT_ID && env.GOOGLE_CLIENT_SECRET) { out.GOOGLE_CLIENT_ID = env.GOOGLE_CLIENT_ID.trim(); out.GOOGLE_CLIENT_SECRET = env.GOOGLE_CLIENT_SECRET.trim(); }
            if (env.ADMIN_EMAILS && env.ADMIN_EMAILS.trim()) out.ADMIN_EMAILS = env.ADMIN_EMAILS.trim();
            if (env.ELEVENLABS_API_KEY && env.ELEVENLABS_API_KEY.trim()) out.ELEVENLABS_API_KEY = env.ELEVENLABS_API_KEY.trim();
            if (env.ELEVENLABS_VOICE_ID && env.ELEVENLABS_VOICE_ID.trim()) out.ELEVENLABS_VOICE_ID = env.ELEVENLABS_VOICE_ID.trim();
            if (env.DEEPINFRA_API_KEY && env.DEEPINFRA_API_KEY.trim()) out.DEEPINFRA_API_KEY = env.DEEPINFRA_API_KEY.trim();
            process.stdout.write(JSON.stringify(out));
          ' > secrets.json
          if [ "$(cat secrets.json)" != "{}" ]; then
            npx wrangler secret bulk secrets.json
          else
            echo "No Google keys or admin emails set in GitHub; leaving the Worker's settings as they are."
          fi
          rm secrets.json
      # Paid plans. Only STRIPE_SECRET_KEY is needed (EC Rental's own Stripe account); the site creates the
      # prices, webhook and billing portal in Stripe by itself. STRIPE_WEBHOOK_SECRET is optional.
      - name: Copy Stripe keys to the Worker
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            node -e '
              const out = { STRIPE_SECRET_KEY: process.env.STRIPE_SECRET_KEY.trim() };
              if (process.env.STRIPE_WEBHOOK_SECRET) out.STRIPE_WEBHOOK_SECRET = process.env.STRIPE_WEBHOOK_SECRET.trim();
              process.stdout.write(JSON.stringify(out));
            ' > stripe.json
            npx wrangler secret bulk stripe.json
            rm stripe.json
          else
            echo "STRIPE_SECRET_KEY not set in GitHub; paid sign-up stays off."
          fi
      - name: Deploy
        run: npx wrangler deploy
      # Tells Bing, Yandex and other IndexNow search engines which pages this push changed, so new guides
      # get crawled within hours instead of weeks. The key file is public/1842a03c0db4f7bd68c1e491cb74e176.txt. Google doesn't use
      # IndexNow; it reads /sitemap.xml once the site is added to Google Search Console.
      - name: Ping search engines about changed pages (IndexNow)
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" HEAD -- 'public/*.html' | grep -v -E '^public/(admin|dashboard|tenant|document|inspection-report|ai-inspection|hub|business|make|videos|ai-chatbot-for-small-business|free-ai-video-maker|how-to-answer-customers-when-your-business-is-closed|small-business-website-faq-page|how-to-follow-up-with-new-leads|how-to-make-a-short-business-video|social-setup)\.html$' || true)
          else
            files="public/index.html"
          fi
          urls=$(for f in $files; do [ -f "$f" ] || continue; p="${f#public}"; p="${p%index.html}"; p="${p%.html}"; echo "https://ecrentalpm.com$p"; done)
          if [ -z "$urls" ]; then echo "No public pages changed."; exit 0; fi
          echo "$urls"
          body=$(printf '%s\n' $urls | jq -R . | jq -s '{host: "ecrentalpm.com", key: "1842a03c0db4f7bd68c1e491cb74e176", keyLocation: "https://ecrentalpm.com/1842a03c0db4f7bd68c1e491cb74e176.txt", urlList: .}')
          curl -sS -o /dev/null -w "IndexNow answered %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body"
      # Same ping for the tello.live front door. The key file is served on both hosts.
      - name: Ping search engines about changed tello.live pages (IndexNow)
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" HEAD -- public/hub.html public/business.html public/make.html public/videos.html public/ai-chatbot-for-small-business.html public/free-ai-video-maker.html public/how-to-answer-customers-when-your-business-is-closed.html public/small-business-website-faq-page.html public/how-to-follow-up-with-new-leads.html public/how-to-make-a-short-business-video.html public/social-setup.html || true)
          else
            files="public/hub.html"
          fi
          urls=$(for f in $files; do [ -f "$f" ] || continue; p="${f#public/}"; p="${p%.html}"; [ "$p" = "hub" ] && p=""; echo "https://tello.live/$p"; done)
          if [ -z "$urls" ]; then echo "No tello.live pages changed."; exit 0; fi
          echo "$urls"
          body=$(printf '%s\n' $urls | jq -R . | jq -s '{host: "tello.live", key: "1842a03c0db4f7bd68c1e491cb74e176", keyLocation: "https://tello.live/1842a03c0db4f7bd68c1e491cb74e176.txt", urlList: .}')
          curl -sS -o /dev/null -w "IndexNow (tello.live) answered %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body"
