# Deploys the site to Cloudflare whenever main changes, so nobody has to run wrangler by hand.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions).
# Optional secrets GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are copied to the Worker when set.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 701117dde6af00d42bac3c4058b660be
    steps:
      - name: Check for the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # schema.sql only uses CREATE ... IF NOT EXISTS, so running it on every deploy is safe.
      - name: Update the database tables
        run: npm run db:init
      - name: Copy Google sign-in keys to the Worker
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            node -e 'process.stdout.write(JSON.stringify({ GOOGLE_CLIENT_ID: process.env.GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET: process.env.GOOGLE_CLIENT_SECRET }))' > secrets.json
            npx wrangler secret bulk secrets.json
            rm secrets.json
          else
            echo "Google keys not set in GitHub; leaving the Worker's Google settings as they are."
          fi
      - name: Deploy
        run: npx wrangler deploy
