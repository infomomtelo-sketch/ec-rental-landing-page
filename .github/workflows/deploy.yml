# Deploys the site to Cloudflare whenever main changes, so nobody has to run wrangler by hand.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions).
# Optional secrets GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET, and ADMIN_EMAILS (comma-separated emails
# that may open /admin), are copied to the Worker when set.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 701117dde6af00d42bac3c4058b660be
    steps:
      - name: Check for the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # schema.sql only uses CREATE ... IF NOT EXISTS, so running it on every deploy is safe.
      - name: Update the database tables
        run: npm run db:init
      - name: Copy Google sign-in keys and admin emails to the Worker
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          node -e '
            const out = {};
            if (process.env.GOOGLE_CLIENT_ID && process.env.GOOGLE_CLIENT_SECRET) { out.GOOGLE_CLIENT_ID = process.env.GOOGLE_CLIENT_ID; out.GOOGLE_CLIENT_SECRET = process.env.GOOGLE_CLIENT_SECRET; }
            if (process.env.ADMIN_EMAILS) out.ADMIN_EMAILS = process.env.ADMIN_EMAILS;
            process.stdout.write(JSON.stringify(out));
          ' > secrets.json
          if [ "$(cat secrets.json)" != "{}" ]; then
            npx wrangler secret bulk secrets.json
          else
            echo "No Google keys or admin emails set in GitHub; leaving the Worker's settings as they are."
          fi
          rm secrets.json
      # Paid plans. Only STRIPE_SECRET_KEY is needed (EC Rental's own Stripe account); the site creates the
      # prices, webhook and billing portal in Stripe by itself. STRIPE_WEBHOOK_SECRET is optional.
      - name: Copy Stripe keys to the Worker
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            node -e '
              const out = { STRIPE_SECRET_KEY: process.env.STRIPE_SECRET_KEY };
              if (process.env.STRIPE_WEBHOOK_SECRET) out.STRIPE_WEBHOOK_SECRET = process.env.STRIPE_WEBHOOK_SECRET;
              process.stdout.write(JSON.stringify(out));
            ' > stripe.json
            npx wrangler secret bulk stripe.json
            rm stripe.json
          else
            echo "STRIPE_SECRET_KEY not set in GitHub; paid sign-up stays off."
          fi
      - name: Deploy
        run: npx wrangler deploy
